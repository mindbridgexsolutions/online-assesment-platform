services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: assessment
      POSTGRES_USER: ${DB_USERNAME:-assess}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d assessment"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/assessment
      DB_USERNAME: ${DB_USERNAME:-assess}
      DB_PASSWORD: ${DB_PASSWORD}
      APP_JWT_SECRET: ${APP_JWT_SECRET:?set APP_JWT_SECRET in .env}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
      SEED_DEMO: ${SEED_DEMO:-false}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Kolkata}
    ports:
      - "${HTTP_PORT:-8080}:8080"
    volumes:
      - uploads:/data/uploads

volumes:
  pgdata:
  uploads:
